<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Concerto City Guides</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <header class="page-header">
      <div class="page-header-inner">
        <a href="index.html"><img src="logo.png" class="brand-logo" alt="Concerto" /></a>
        <div class="search-wrapper">
          <input id="venueSearch" type="text" placeholder="Search a venue..." autocomplete="off" />
          <div id="searchResults" class="search-results"></div>
        </div>
      </div>
    </header>

    <main class="layout">
      <div id="map" class="map"></div>

      <section id="guidePanel" class="guide-panel guide-panel--hidden">
        <div class="drag-handle"></div>
        
        <header class="guide-header">
          <div>
            <p class="eyebrow">City Guide</p>
            <h2 id="guideVenueName"></h2>
            <p id="guideVenueLocation" class="venue-location"></p>
          </div>
          <button id="backToMapBtn" class="close-panel-btn">✕</button>
        </header>

        <div class="timeline-scroller" id="timelineScroller">
          <button class="timeline-pill active" data-cat="pregame">🍸 Pre-Game</button>
          <button class="timeline-pill" data-cat="afterglow">🍕 Afterglow</button>
          <button class="timeline-pill" data-cat="recovery">☕ Recovery</button>
          <button class="timeline-pill" data-cat="stay">🏨 Where to Stay</button>
        </div>

        <div id="guideResults" class="guide-results"></div>
      </section>

      <div id="placeDetails" class="place-details-overlay" hidden>
        <div class="place-details-card">
          <button id="placeDetailsClose" class="place-details-close" type="button">✕</button>
          <h3 id="detailsName" class="details-name"></h3>
          <p id="detailsMeta" class="details-meta"></p>
          <p id="detailsAddress" class="details-address"></p>
          <div class="details-actions">
            <a id="detailsPhoneBtn" class="details-action-btn" href="#" hidden>Call</a>
            <a id="detailsWebsiteBtn" class="details-action-btn" href="#" hidden>Website</a>
            <a id="detailsMapsLink" class="details-action-btn btn-gold" href="#" target="_blank" rel="noopener noreferrer">Route Me</a>
          </div>
          <div id="detailsHours" class="details-hours"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAEl3Mjr2zQPJySBCD0JJZEVS5xcJPB-2w&libraries=places&callback=initMap" async defer></script>
</body>
</html>
